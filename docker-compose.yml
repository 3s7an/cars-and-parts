services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        APP_URL: ${APP_URL}
    env_file:
      - .env
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-mysql}
      VITE_DEV_SERVER_URL: ${VITE_DEV_SERVER_URL:-}
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./.env:/var/www/html/.env
      - app-storage:/var/www/html/storage
      - app-bootstrap-cache:/var/www/html/bootstrap/cache
      - ./storage/logs:/var/www/html/storage/logs
      - ./database/seeders/data:/var/www/html/database/seeders/data
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        APP_URL: ${APP_URL}
    env_file:
      - .env
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-mysql}
    entrypoint: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=60", "--max-time=3600"]
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    volumes:
      - ./.env:/var/www/html/.env
      - app-storage:/var/www/html/storage
      - app-bootstrap-cache:/var/www/html/bootstrap/cache
      - ./storage/logs:/var/www/html/storage/logs
    restart: unless-stopped

  vite:
    build:
      context: .
      dockerfile: docker/Dockerfile.vite
    env_file:
      - .env
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - .:/var/www/html
      - vite-node-modules:/var/www/html/node_modules
      - vite-vendor:/var/www/html/vendor
    restart: unless-stopped

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$MYSQL_ROOT_PASSWORD\" ]; then mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\"; else mysqladmin ping -h 127.0.0.1 -uroot; fi",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  dbhub:
    image: bytebase/dbhub:latest
    ports:
      - "${DBHUB_PORT:-8080}:8080"
    environment:
      DSN: ${DBHUB_DSN:-mysql://root@mysql:3306/${DB_DATABASE:-cars_parts}}
    command:
      - --transport
      - http
      - --port
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  app-storage:
  app-bootstrap-cache:
  vite-node-modules:
  vite-vendor: